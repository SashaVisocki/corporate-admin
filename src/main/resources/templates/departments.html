<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Отделы · Corporate Admin</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header><a class="logo" href="/">Corporate Admin</a><nav><a th:if="${canEmployees}" href="/employees">Сотрудники</a><a class="active" href="/departments">Отделы</a><a th:if="${canRoles}" href="/roles">Роли и права</a></nav><form method="post" th:action="@{/logout}"><button class="ghost">Выйти</button></form></header><main><div class="eyebrow">СТРУКТУРА</div><h1>Отделы</h1><p class="muted">Справочник подразделений компании.</p><div class="alert" th:if="${message}" th:text="${message}"></div><div class="alert error" th:if="${error}" th:text="${error}"></div><section class="split"><div class="panel"><h2>Список отделов</h2><div class="department" th:each="d : ${departments}"><span th:text="${d.name}"></span><form th:if="${canDepartmentWrite}" method="post" th:action="@{/departments/save}"><input type="hidden" name="id" th:value="${d.id}"><input name="name" th:value="${d.name}" maxlength="100" required aria-label="Название отдела"><button class="small">Изменить</button></form></div><p class="muted" th:if="${#lists.isEmpty(departments)}">Отделов пока нет.</p></div><form th:if="${canDepartmentWrite}" class="panel form" method="post" th:action="@{/departments/save}"><h2>Новый отдел</h2><label>Название<input name="name" maxlength="100" required></label><button>Добавить</button></form></section></main></body></html>
