<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Обзор · Corporate Admin</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header><a class="logo" href="/">Corporate Admin</a><nav><a th:if="${canEmployees}" href="/employees">Сотрудники</a><a th:if="${canDepartments}" href="/departments">Отделы</a><a th:if="${canRoles}" href="/roles">Роли и права</a></nav><form method="post" th:action="@{/logout}"><button class="ghost">Выйти</button></form></header><main><div class="eyebrow">ПАНЕЛЬ УПРАВЛЕНИЯ</div><h1>Здравствуйте, <span th:text="${username}"></span></h1><p class="muted">Управляйте справочником компании и доступом к нему.</p><section class="cards"><a th:if="${canEmployees}" class="card" href="/employees"><span>Сотрудники</span><strong th:text="${employeeCount}"></strong><small>Учетные записи и роли →</small></a><a th:if="${canDepartments}" class="card" href="/departments"><span>Отделы</span><strong th:text="${departmentCount}"></strong><small>Структура компании →</small></a><a th:if="${canRoles}" class="card" href="/roles"><span>Доступ</span><strong>RBAC</strong><small>Разрешения ролей →</small></a></section></main></body></html>
