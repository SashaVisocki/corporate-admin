<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход · Corporate Admin</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="login-page"><main class="login-card"><div class="brand">CA</div><h1>Corporate Admin</h1><p>Войдите в панель управления</p><div class="alert error" th:if="${param.error}">Неверный логин или пароль</div><div class="alert" th:if="${param.logout}">Вы вышли из системы</div><form method="post" th:action="@{/login}"><label>Логин<input name="username" autocomplete="username" required autofocus></label><label>Пароль<input type="password" name="password" autocomplete="current-password" required></label><button>Войти</button></form></main></body></html>
