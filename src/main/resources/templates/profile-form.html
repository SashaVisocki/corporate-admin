<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Данные сотрудника · Corporate Admin</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header><a class="logo" href="/">Corporate Admin</a><nav><a href="/employees">Сотрудники</a><a th:if="${canDepartments}" href="/departments">Отделы</a><a th:if="${canRoles}" href="/roles">Роли и права</a></nav><form method="post" th:action="@{/logout}"><button class="ghost">Выйти</button></form></header><main class="narrow"><a class="back" href="/employees">← К списку сотрудников</a><h1>Данные сотрудника</h1><p class="muted">Здесь можно изменить имя и отдел. Настройки доступа находятся в отдельной форме.</p><div class="alert error" th:if="${error}" th:text="${error}"></div><form class="panel form" method="post" th:action="@{/employees/{id}/profile(id=${employee.id})}"><label>Полное имя<input name="fullName" maxlength="100" th:value="${employee.fullName}" required></label><label>Отдел<select name="departmentId"><option value="">Без отдела</option><option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}" th:selected="${employee.department != null and employee.department.id == d.id}"></option></select></label><button>Сохранить</button></form></main></body></html>
