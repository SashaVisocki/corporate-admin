<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сотрудники · Corporate Admin</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header><a class="logo" href="/">Corporate Admin</a><nav><a class="active" href="/employees">Сотрудники</a><a th:if="${canDepartments}" href="/departments">Отделы</a><a th:if="${canRoles}" href="/roles">Роли и права</a></nav><form method="post" th:action="@{/logout}"><button class="ghost">Выйти</button></form></header><main><div class="heading"><div><div class="eyebrow">СПРАВОЧНИК</div><h1>Сотрудники</h1><p class="muted">Пользователи сервиса и их роли.</p></div><a th:if="${canManage}" class="button" href="/employees/new">+ Добавить сотрудника</a></div><div class="alert" th:if="${message}" th:text="${message}"></div><div class="table-wrap"><table><thead><tr><th>Сотрудник</th><th>Логин</th><th>Отдел</th><th>Роль</th><th>Статус</th><th></th></tr></thead><tbody><tr th:each="e : ${employees}"><td th:text="${e.fullName}"></td><td th:text="${e.username}"></td><td th:text="${e.department == null ? '—' : e.department.name}"></td><td><span class="pill" th:text="${e.role.name}"></span></td><td th:text="${e.enabled ? 'Активен' : 'Отключён'}"></td><td><a th:if="${canEmployeeWrite}" th:href="@{/employees/{id}/profile(id=${e.id})}">Данные</a> <a th:if="${canManage}" th:href="@{/employees/{id}/edit(id=${e.id})}">Доступ</a></td></tr></tbody></table><p class="empty" th:if="${#lists.isEmpty(employees)}">Сотрудников пока нет.</p></div></main></body></html>
