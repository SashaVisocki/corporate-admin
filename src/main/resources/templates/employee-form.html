<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сотрудник · Corporate Admin</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header><a class="logo" href="/">Corporate Admin</a><nav><a href="/employees">Сотрудники</a><a th:if="${canDepartments}" href="/departments">Отделы</a><a th:if="${canRoles}" href="/roles">Роли и права</a></nav><form method="post" th:action="@{/logout}"><button class="ghost">Выйти</button></form></header><main class="narrow"><a class="back" href="/employees">← К списку сотрудников</a><h1 th:text="${employee == null ? 'Новый сотрудник' : 'Изменить сотрудника'}"></h1><div class="alert error" th:if="${error}" th:text="${error}"></div><form class="panel form" method="post" th:action="@{/employees/save}"><input type="hidden" name="id" th:if="${employee != null}" th:value="${employee.id}"><label>Логин<input name="username" maxlength="80" th:value="${employee?.username}" th:readonly="${employee != null}" th:required="${employee == null}"></label><label>Полное имя<input name="fullName" maxlength="100" th:value="${employee?.fullName}" required></label><label><span th:text="${employee == null ? 'Пароль (минимум 12 символов)' : 'Новый пароль (оставьте пустым, чтобы сохранить прежний)'}"></span><input type="password" name="password" minlength="12" th:required="${employee == null}" autocomplete="new-password"></label><label>Роль<select name="roleId" required><option th:each="r : ${roles}" th:if="${employee != null or r.name != 'ADMIN'}" th:value="${r.id}" th:text="${r.name}" th:selected="${employee == null ? r.name == 'VIEWER' : employee.role.id == r.id}"></option></select></label><label>Отдел<select name="departmentId"><option value="">Без отдела</option><option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}" th:selected="${employee != null and employee.department != null and employee.department.id == d.id}"></option></select></label><label class="check"><input type="checkbox" name="enabled" value="true" th:checked="${employee == null or employee.enabled}"> Активен</label><button>Сохранить</button></form></main></body></html>
