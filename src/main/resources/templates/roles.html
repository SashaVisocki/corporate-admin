<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Роли и права · Corporate Admin</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header><a class="logo" href="/">Corporate Admin</a><nav><a th:if="${canEmployees}" href="/employees">Сотрудники</a><a th:if="${canDepartments}" href="/departments">Отделы</a><a class="active" href="/roles">Роли и права</a></nav><form method="post" th:action="@{/logout}"><button class="ghost">Выйти</button></form></header><main><div class="eyebrow">БЕЗОПАСНОСТЬ</div><h1>Роли и права</h1><p class="muted">Изменения прав вступают в силу сразу. Роль ADMIN защищена от изменения.</p><div class="alert" th:if="${message}" th:text="${message}"></div><div class="alert error" th:if="${error}" th:text="${error}"></div><section class="role-grid"><form class="panel form" th:each="r : ${roles}" method="post" th:action="@{/roles/{id}/permissions(id=${r.id})}"><h2 th:text="${r.name}"></h2><label class="check" th:each="p : ${permissions}"><input type="checkbox" name="permissions" th:value="${p.name()}" th:checked="${r.permissions.contains(p)}" th:disabled="${!canRoleWrite or r.name == 'ADMIN'}"><span th:text="${p.label}"></span></label><button th:if="${canRoleWrite and r.name != 'ADMIN'}">Сохранить права</button></form></section></main></body></html>
